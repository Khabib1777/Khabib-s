<style>:root{--bg:#f4f6fb;--card:#fff;--ink:#16203a;--mut:#5d6985;--line:#e2e7f2;--pri:#0b5fff;--pri2:#6a3df0;--acc:#f5a524;--ok:#12a150;--bad:#e5484d;--warn:#d97706;--hl:#fff3a3;--shadow:0 6px 24px rgba(20,35,80,.08);--r:14px}
:root[data-theme=dark]{--bg:#0e1426;--card:#171f38;--ink:#e8ecf8;--mut:#9aa6c6;--line:#2a3558;--pri:#5b8cff;--pri2:#9a7bff;--hl:#5a4f10;--shadow:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
a{color:var(--pri);text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top-in{max-width:1200px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.brand{font-weight:900;font-size:22px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand small{font-size:11px;color:var(--mut);-webkit-text-fill-color:var(--mut);font-weight:600;margin-left:6px}
nav.menu{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav.menu a{padding:7px 11px;border-radius:9px;color:var(--ink);font-weight:600;font-size:14px}
nav.menu a:hover{background:var(--bg)}nav.menu a.on{background:var(--pri);color:#fff}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.iconbtn{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
.net{font-size:12px;padding:3px 8px;border-radius:99px;background:#e6f7ee;color:#0b7a3e;font-weight:700}.net.off{background:#fff1d6;color:#8a5a00}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px}
h1{font-size:28px;margin:6px 0 4px}h2{font-size:21px;margin:22px 0 10px}h3{font-size:17px;margin:14px 0 6px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.hero{background:linear-gradient(135deg,#0b2a7a,#5b2fd6 60%,#c04bd0);color:#fff;border-radius:20px;padding:34px 26px;margin-bottom:20px;box-shadow:var(--shadow)}
.hero h1{font-size:36px;margin:0 0 8px;color:#fff}.hero p{margin:0 0 14px;max-width:640px;opacity:.95}
.mod{display:block;color:var(--ink);transition:.15s;cursor:pointer}.mod:hover{transform:translateY(-3px);border-color:var(--pri)}
.mod .ic{font-size:34px}.mod b{font-size:19px;display:block;margin:6px 0 2px}.mod span{color:var(--mut);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.btn:hover{filter:brightness(1.08)}.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--acc);color:#2a1a00}.btn.sm{padding:5px 10px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}.tab{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:14px}.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.pill.ok{background:#e6f7ee;color:#0b7a3e;border-color:#bfe8d1}.pill.bad{background:#fdeaea;color:#a02126;border-color:#f6c7c9}
.tl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
.tl:hover{border-color:var(--pri)}.tl b{display:block}.tl small{color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));width:0;transition:.3s}
.exam{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.exam.one{grid-template-columns:1fr}
.passage{max-height:75vh;overflow:auto;position:sticky;top:70px}
.passage p{margin:0 0 12px;text-align:justify}.passage h3{margin-top:0}
.qpanel{max-height:none}
.q{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.q:last-child{border:0}
.qn{min-width:30px;height:30px;border-radius:8px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.qb{flex:1}.qb p{margin:0 0 6px}
.opt{display:block;padding:5px 8px;border-radius:8px;cursor:pointer}.opt:hover{background:var(--bg)}.opt input{margin-right:8px}
input.gap{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;min-width:150px;width:180px}
input.gap:focus,textarea:focus,select:focus{outline:2px solid var(--pri);border-color:var(--pri)}
.q.right{background:rgba(18,161,80,.08)}.q.right .qn{background:var(--ok)}.q.wrong{background:rgba(229,72,77,.08)}.q.wrong .qn{background:var(--bad)}
.rev{font-size:13px;margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--bg);border-left:3px solid var(--pri)}
.rev b{color:var(--ok)}
.sec-note{padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin-bottom:10px;font-size:14px;color:var(--mut)}
mark{background:var(--hl);color:inherit;padding:0 1px;border-radius:3px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;padding:4px 12px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}.timer.low{color:var(--bad)}
.player{padding:14px;border-radius:12px;background:linear-gradient(135deg,rgba(11,95,255,.08),rgba(106,61,240,.08));border:1px solid var(--line);margin-bottom:12px}
.big{font-size:44px;font-weight:900;line-height:1;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat{text-align:center}.stat .big{display:block}.stat small{color:var(--mut)}
textarea.ed{width:100%;min-height:380px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card);resize:vertical;line-height:1.6}
.wc{font-weight:700}
table.t{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left}table.t th{background:var(--bg)}
.note{padding:8px 12px;border-radius:9px;margin:6px 0;font-size:14px;border-left:4px solid var(--mut);background:var(--bg)}.note.good{border-color:var(--ok)}.note.warn{border-color:var(--warn)}.note.bad{border-color:var(--bad)}
.chat{display:flex;flex-direction:column;height:68vh;min-height:420px}.msgs{flex:1;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:14px;font-size:15px}.m.u{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}.m.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.m ul{margin:6px 0 6px 18px;padding:0}.m p{margin:0 0 6px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}.chip:hover{border-color:var(--pri)}
.flash{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;gap:6px}.flash .w{font-size:32px;font-weight:900}
.slide{display:flex;align-items:center;gap:10px}.slide input[type=range]{flex:1}
.cue{border:2px dashed var(--pri);border-radius:14px;padding:16px;background:var(--card)}.cue ul{margin:6px 0 0 20px}
.rec{width:14px;height:14px;border-radius:50%;background:var(--bad);display:inline-block;animation:bl 1s infinite}@keyframes bl{50%{opacity:.25}}
.hist td,.hist th{font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.modal{max-width:560px;width:100%}
@media(max-width:860px){.exam{grid-template-columns:1fr}.passage{position:static;max-height:42vh}.burger{display:block}nav.menu{display:none;position:absolute;left:0;right:0;top:100%;background:var(--card);padding:8px;border-bottom:1px solid var(--line);flex-direction:column}nav.menu.open{display:flex}.hero h1{font-size:28px}}

.pill.lv{color:#fff;border:0;font-weight:800}.lvA0{background:#8b5cf6}.lvA1{background:#12a150}.lvA2{background:#06b6d4}.lvB1{background:#0b5fff}.lvB2{background:#f5a524;color:#2a1a00}.lvC1{background:#e5484d}

<script>/* Original IELTS-style reading practice passages (written for Khabib's). */
const M=(q,o,a,e)=>({t:'mcq',q,o,a,e});
const TF=(q,a,e)=>({t:'tf',q,a,e});
const G=(q,a,e)=>({t:'gap',q,a:[].concat(a),e});

const READING=[
{id:'R1',title:'The Return of the Urban Beehive',level:'Passage 1',minutes:20,
text:[
"Over the past two decades, beekeeping has quietly moved from the countryside to the rooftops of major cities. In London, the number of registered hives rose from around 1,000 in 2008 to more than 6,000 a decade later, and similar trends have been recorded in Paris, New York and Tokyo. Supporters argue that cities offer surprisingly good conditions for bees. Gardens, parks and street trees provide a wide variety of flowering plants that bloom at different times, while the absence of large-scale pesticide spraying, which is common on farmland, reduces the risk of poisoning. Urban temperatures, which are typically one or two degrees higher than in surrounding areas, also allow colonies to start foraging earlier in spring.",
"However, the boom has not been welcomed by everyone. Ecologists at a university in Sussex studied several urban areas and concluded that in some districts there are now more hives than the local flowers can support. When honeybees are packed too densely, they compete with wild pollinators such as bumblebees and hoverflies for the same nectar. Because honeybees are managed and protected by their keepers, while wild species are not, the wild insects are usually the losers. One survey found that in the most crowded neighbourhoods, honeybees were visiting up to 60 per cent of available flowers, leaving little for other species.",
"The honey itself has also attracted attention. Urban honey is often marketed as a premium product, and laboratory tests have shown that it contains few heavy metals, contrary to what many people expect. Plants filter most pollutants before they reach the nectar. Yet the quantities are small: an average rooftop hive yields about 15 kilograms a year, roughly half the figure for a rural hive, because city bees must travel further to find enough food in a concrete landscape.",
"Some experts now suggest that cities should focus less on hives and more on habitat. Planting native wildflowers, leaving patches of grass uncut, and providing nesting sites for solitary bees would support a far wider range of species. Several municipal councils have begun to limit the number of hives permitted in each district, and one has introduced a licence that must be renewed every year."],
groups:[
{ins:'Questions 1–5. Do the following statements agree with the information in the passage? Choose TRUE, FALSE or NOT GIVEN.',qs:[
TF('The number of registered hives in London at least quintupled between 2008 and 2018.','TRUE','"from around 1,000 in 2008 to more than 6,000 a decade later".'),
TF('Pesticide use is heavier in cities than on farmland.','FALSE','Large-scale spraying is "common on farmland", and absent in cities.'),
TF('The Sussex researchers found that wild pollinators locate nectar more efficiently than honeybees.','NOT GIVEN','No comparison of efficiency is made.'),
TF('Laboratory tests found high levels of heavy metals in urban honey.','FALSE','Tests showed it "contains few heavy metals".'),
TF('Some local authorities have started to restrict how many hives are allowed.','TRUE','"Several municipal councils have begun to limit the number of hives".')]},
{ins:'Questions 6–10. Complete the sentences. Write NO MORE THAN TWO WORDS for each answer.',qs:[
G('Higher urban temperatures allow colonies to start ___ earlier in spring.','foraging','"start foraging earlier in spring".'),
G('In crowded areas, honeybees compete with wild pollinators for the same ___.','nectar','"compete ... for the same nectar".'),
G('A typical rooftop hive produces about ___ kilograms of honey a year.',['15','fifteen'],'"about 15 kilograms a year".'),
G('Experts suggest planting ___ to support a wider range of species.',['native wildflowers','wildflowers'],'"Planting native wildflowers".'),
G('One council requires keepers to renew a ___ every year.',['licence','license'],'"a licence that must be renewed every year".')]}]},

{id:'R2',title:'Writing by Hand in a Digital Age',level:'Passage 2',minutes:20,
text:[
"For centuries, handwriting sat at the centre of schooling. In recent years, however, many education systems have reduced the time devoted to it. In the United States, a national set of learning standards introduced in 2010 no longer required schools to teach cursive writing, and Finland went further in 2016 by replacing handwriting lessons for older primary pupils with typing practice. Supporters of the change point out that adults rarely write more than a signature or a shopping list, so classroom time would be better spent on keyboard skills.",
"Neuroscientific research complicates that argument. In one experiment at a Norwegian university, researchers recorded the brain activity of students as they wrote words by hand and then typed the same words. Handwriting produced widespread connectivity between regions associated with memory and learning, whereas typing produced far less. A separate study of young children found that those who practised forming letters by hand learned to recognise them faster than classmates who only typed them.",
"Other findings are less clear-cut. A widely cited study from 2014 claimed that students who took notes by hand performed better on conceptual questions than students using laptops. The authors explained this by suggesting that typists tend to copy lectures word for word, whereas hand writers, being slower, are forced to summarise. However, when a later team tried to repeat the study, they found no clear difference between the two groups. Many researchers now believe that the quality of the notes matters more than the tool used to produce them.",
"Teachers also raise practical concerns. Children with motor-skill difficulties can become discouraged when forced to write by hand, and for them a keyboard may reduce frustration. At the same time, some specialists in dyslexia recommend handwriting because it encourages pupils to slow down and attend to the shape of each letter. Few educators argue for abandoning either skill. Most favour a balanced approach in which pupils learn both, choosing the method that suits the task."],
groups:[
{ins:'Questions 11–14. Choose the correct letter, A, B, C or D.',qs:[
M('Why do supporters of reducing handwriting lessons hold that view?',['Handwriting damages memory.','Adults seldom write much by hand.','Typing is easier to teach.','Cursive is difficult to read.'],1,'"adults rarely write more than a signature or a shopping list".'),
M('What did the Norwegian experiment show?',['Typing activated more brain regions.','Students wrote faster by hand.','Handwriting produced stronger connectivity.','Memory tests were easier on paper.'],2,'"Handwriting produced widespread connectivity ... typing produced far less."'),
M('According to the authors of the 2014 study, hand writers did better because they',['wrote more words.','were forced to summarise.','listened more carefully.','used better equipment.'],1,'"hand writers, being slower, are forced to summarise".'),
M('What happened when the 2014 study was repeated?',['The same result appeared.','The opposite result appeared.','No clear difference was found.','The study could not be completed.'],2,'"they found no clear difference".')]},
{ins:'Questions 15–18. Do the following statements agree with the information in the passage? Choose TRUE, FALSE or NOT GIVEN.',qs:[
TF('Finland replaced handwriting lessons for older primary pupils with typing practice.','TRUE','"Finland went further in 2016 ..."'),

{id:'R3',title:'Gardening the Reef',level:'Passage 3',minutes:20,
text:[
"Coral reefs cover less than one per cent of the ocean floor, yet they support roughly a quarter of all marine species. Rising sea temperatures, however, have caused repeated mass bleaching events, in which corals expel the algae that live inside them and provide most of their food. Since the 1980s, scientists estimate that the world has lost around half of its shallow-water corals.",
"One response is 'coral gardening'. Divers collect small fragments from healthy colonies, grow them in underwater nurseries for several months, and then fix them back onto damaged reefs with cement or cable ties. The technique was first developed in the Caribbean, where the fast-growing staghorn coral could increase its size tenfold in a single year inside a nursery. Today, similar projects operate in Indonesia, Fiji and the Maldives, some of them employing former fishermen as technicians.",
"Critics warn that gardening alone cannot save reefs. Fragments taken from only a few parent colonies produce genetically similar offspring, which may all die in the same heatwave. Researchers in Australia have therefore begun to select and breed corals that survive unusually warm water. Early trials suggest that the offspring of these 'heat-tolerant' parents can survive temperatures about one degree higher than ordinary corals, although it is not yet known whether this advantage will last throughout their lives.",
"Another concern is cost. Restoring a single hectare of reef can cost hundreds of thousands of dollars, far more than protecting an existing reef from overfishing. Most scientists agree that restoration should complement rather than replace efforts to cut greenhouse gas emissions, since without cooler seas even the most carefully planted reef would remain at risk."],
groups:[
{ins:'Questions 21–25. TRUE, FALSE or NOT GIVEN?',qs:[
TF('Coral reefs cover more than one per cent of the ocean floor.','FALSE','"less than one per cent".'),
TF('Bleaching happens when corals lose the algae that supply most of their food.','TRUE','"expel the algae ... provide most of their food".'),
TF('Coral gardening was first developed in the Pacific Ocean.','FALSE','"first developed in the Caribbean".'),
TF('Some restoration projects employ former fishermen.','TRUE','"employing former fishermen as technicians".'),
TF('Heat-tolerant corals are known to keep their advantage for their whole lives.','NOT GIVEN','"it is not yet known whether this advantage will last".')]},
{ins:'Questions 26–28. Complete the sentences. NO MORE THAN TWO WORDS.',qs:[
G('Divers fix fragments onto reefs with cement or ___.',['cable ties'],'"cement or cable ties".'),
G('In a nursery, staghorn coral could increase its size ___ in a year.',['tenfold','ten times','ten-fold'],'"increase its size tenfold".'),
G('Fragments from a few parents produce ___ similar offspring.',['genetically'],'"genetically similar offspring".')]},
{ins:'Questions 29–30. Choose the correct letter.',qs:[
M('Why do critics say coral gardening alone is not enough?',['It is too slow.','Offspring of few parents lack genetic variety.','Divers lack the skills.','Cement damages the reef.'],1,'Fragments from few colonies "produce genetically similar offspring".'),
M('What do most scientists think about restoration?',['It should replace emission cuts.','It should be done alongside cutting emissions.','It is too expensive to continue.','It works better than protection.'],1,'"complement rather than replace efforts to cut ... emissions".')]}]},

{id:'R4',title:'Keeping Cities Cool',level:'Passage 1',minutes:20,
text:[
"Cities are typically warmer than the countryside around them, a phenomenon known as the urban heat island effect. Dark roads and roofs absorb sunlight and release it slowly after sunset, while tall buildings block breezes and reduce evaporation. On a summer night, the centre of a large city can be up to 7°C warmer than nearby rural areas, increasing demand for air conditioning and putting vulnerable residents, especially the elderly, at risk.",
"Trees offer the most familiar solution. They shade surfaces and release water vapour from their leaves, which cools the air. In Medellín, Colombia, the municipality linked its parks and roads with 30 'green corridors' planted with thousands of trees and shrubs. Within three years, average temperatures in those areas were around 2°C lower. Planting is not always straightforward, however: trees need space for their roots and regular watering in their early years, and species must be chosen carefully to avoid those that produce allergenic pollen.",
"Where there is no room for trees, engineers turn to roofs. 'Green roofs', covered with soil and plants, insulate buildings and absorb rainwater, but they are heavy and expensive to maintain. 'Cool roofs' are simply painted white or covered in reflective material. They cost little, and a study in New York found that they can reduce the indoor temperature of top-floor flats by several degrees. A drawback is that in cold climates, reflective roofs can increase heating bills in winter.",
"A more recent approach is to redesign cities from the start. Stuttgart in Germany protects 'ventilation corridors' — wide strips of open land that allow cool air from the surrounding hills to flow into the centre. Developers there must show that new buildings will not block these paths. Experts say that combining several measures is more effective than relying on any single one."],
groups:[
{ins:'Questions 1–4. Choose the correct letter.',qs:[
M('Dark surfaces raise night-time temperatures because they',['reflect too much light.','release absorbed heat slowly after sunset.','produce heat from traffic.','prevent rainwater from evaporating.'],1,'"absorb sunlight and release it slowly after sunset".'),
M('What was the result of the Medellín project?',['Many trees died.','Temperatures fell by about 2°C within three years.','Air conditioning use doubled.','Pollen levels rose.'],1,'"Within three years ... around 2°C lower".'),
M('What is mentioned as a disadvantage of green roofs?',['They reflect too little light.','They are heavy and costly to maintain.','They raise heating bills.','They attract insects.'],1,'"heavy and expensive to maintain".'),
M('What does Stuttgart do to keep its centre cool?',['Paints roofs white.','Bans cars.','Protects open strips that let cool air in.','Plants only one tree species.'],2,'"ventilation corridors".')]},
{ins:'Questions 5–8. TRUE, FALSE or NOT GIVEN?',qs:[
TF('Large-city centres can be as much as 7°C warmer than rural areas at night.','TRUE','"up to 7°C warmer".'),
TF('Any tree species can be planted in cities without problems.','FALSE','"species must be chosen carefully".'),
TF('Cool roofs are more expensive than green roofs.','FALSE','Cool roofs "cost little"; green roofs are "expensive to maintain".'),
TF('The Medellín project was paid for by an international bank.','NOT GIVEN','Funding is not mentioned.')]},
{ins:'Questions 9–10. Complete the sentences. NO MORE THAN TWO WORDS.',qs:[
G('In cold climates, reflective roofs can increase ___ in winter.',['heating bills','heating costs'],'"increase heating bills in winter".'),
G('Experts say combining several ___ is more effective than using a single one.',['measures'],'"combining several measures".')]}]},

{id:'R5',title:'Fare-Free Public Transport',level:'Passage 2',minutes:20,
text:[
"In 2013, Tallinn, the capital of Estonia, became the first European capital to offer free public transport to its residents, who had to register their address in the city to qualify. The city hoped the policy would persuade people to leave their cars at home, ease congestion and help poorer residents to travel. In 2020, Luxembourg went further by making all trains, trams and buses free across the whole country.",
"Results have been mixed. In Tallinn, public transport use rose by about 10 per cent in the first year, but a later survey found that most of the extra passengers were people who used to walk or cycle. Car use fell only slightly. Researchers say this is typical: where fares are already low compared with the cost of driving, removing them seldom changes the behaviour of motorists, who care more about speed and convenience than price.",
"Free transport does bring other benefits. The city's income from taxes grew as thousands of people formally registered their address, since registration was required for free travel. Low-income residents and young people reported making more journeys to work, education and healthcare appointments.",
"Critics point to the cost. Fares usually cover a significant part of operating budgets, and without them cities must find the money elsewhere, often through general taxation. Some argue that this money would be better spent improving frequency and reliability, which, according to surveys, influence drivers' choices more than fares do. Others suggest targeted discounts for students, pensioners and low-income residents as a cheaper alternative."],
groups:[
{ins:'Questions 11–14. Choose the correct letter.',qs:[
M('One aim of Tallinn\'s policy was to',['increase fares for tourists.','reduce car use and congestion.','build new tram lines.','attract foreign investment.'],1,'"leave their cars at home, ease congestion".'),
M('What did the Tallinn survey find about the extra passengers?',['They were mostly former drivers.','They were mostly tourists.','They were mostly former walkers and cyclists.','They were mostly pensioners.'],2,'"most of the extra passengers ... used to walk or cycle".'),
M('Why does removing fares seldom change motorists\' behaviour?',['They cannot afford cars.','They value speed and convenience over price.','They distrust public transport.','They live far from stops.'],1,'"care more about speed and convenience than price".'),
M('What alternative do some critics propose?',['Higher taxes.','Free transport for everyone.','Discounts for particular groups.','Fewer bus routes.'],2,'"targeted discounts for students, pensioners ...".')]},
{ins:'Questions 15–18. TRUE, FALSE or NOT GIVEN?',qs:[
TF('Tallinn was the first European capital to offer free public transport to residents.','TRUE','"became the first European capital".'),
TF('Luxembourg\'s free transport applies only in its capital city.','FALSE','"across the whole country".'),
TF('Car use in Tallinn fell dramatically.','FALSE','"fell only slightly".'),
TF('Tallinn introduced free transport after a public vote.','NOT GIVEN','No vote is mentioned.')]},
{ins:'Questions 19–20. Complete the sentences. ONE WORD ONLY.',qs:[
G('To travel free, people had to ___ their address in the city.',['register'],'"had to register their address".'),
G('Surveys suggest ___ and reliability influence drivers more than fares.',['frequency'],'"improving frequency and reliability".')]}]},

{id:'R6',title:'The Memory Palace',level:'Passage 3',minutes:20,
text:[
"According to legend, the Greek poet Simonides was able to identify the victims of a collapsed banquet hall by remembering where each guest had been sitting. Ancient orators later turned this feat into a technique: to remember a speech, they imagined walking through a familiar building and placing a vivid image of each topic in a particular room. By mentally retracing the route, they could recall their points in order. The method is known as the method of loci, or the 'memory palace'.",
"Modern memory champions still rely on it. Contestants in memory competitions can memorise the order of a shuffled pack of cards in well under a minute. They convert each card into a person performing an action, and place these scenes along an imagined path. Brain scans of such champions show nothing unusual about their brain structure; instead, they reveal heightened activity in regions linked to spatial navigation.",
"A well-known study took 51 volunteers with average memories and trained half of them for six weeks, for 30 minutes a day. At the end, the trained group could recall roughly twice as many words from a list as before, while a control group that did not train showed little change. Several months later, the trained participants still remembered far more than the others, even though they had stopped practising.",
"Why does it work? Psychologists suggest that human brains evolved to remember places and routes, which were once vital for finding food, rather than abstract lists. Vivid, unusual or humorous images are also remembered better than ordinary ones. However, the technique has limits. It is slow to set up, works best for lists and sequences, and is less useful for understanding complex ideas. Education researchers therefore regard it as a supplement to, not a replacement for, deeper study."],
groups:[
{ins:'Questions 21–25. TRUE, FALSE or NOT GIVEN?',qs:[
TF('Simonides identified victims by remembering where they had been seated.','TRUE','"remembering where each guest had been sitting".'),
TF('Ancient orators used the technique to remember speeches.','TRUE','"to remember a speech, they imagined walking ...".'),
TF('Brain scans showed that memory champions have unusually large brains.','FALSE','"nothing unusual about their brain structure".'),
TF('The volunteers in the study trained for twelve weeks.','FALSE','"six weeks".'),
TF('The memory palace works best for understanding complex ideas.','FALSE','"less useful for understanding complex ideas".')]},
{ins:'Questions 26–28. Complete the sentences. ONE WORD ONLY.',qs:[
G('Orators placed an image of each topic in a particular ___.',['room'],'"in a particular room".'),
G('Champions turn each card into a person performing an ___.',['action'],'"a person performing an action".'),
G('Champions\' brain scans show more activity in regions linked to spatial ___.',['navigation'],'"spatial navigation".')]},
{ins:'Questions 29–30. Choose the correct letter.',qs:[
M('What happened to the control group in the study?',['It improved greatly.','It showed little change.','It got worse.','It was not tested.'],1,'"showed little change".'),
M('Why do psychologists think the method works?',['Brains evolved to remember places and routes.','Humans prefer abstract lists.','Images are easy to draw.','Rooms are easy to build.'],0,'"brains evolved to remember places and routes".')]}]}
];

"Tom: Good morning, everyone, and welcome to Greenfield Farm Park. My name's Tom, and I'll be showing you round today. Before we start, a few practical points.",
"Tom: The park opened in nineteen ninety-eight as a small family farm. The founders soon realised that visitors were more interested in the animals than in the crops, so these days we keep more than forty species of animal, although we still grow wheat in the northern fields.",
"Tom: Our most popular attraction is normally the petting barn, but please note that it's closed until the end of the month, because a storm damaged the roof. In its place, we've set up a temporary animal-handling area next to the café, where you can meet rabbits and guinea pigs.",
"Tom: Tractor rides are included in your ticket. They leave from the main gate every half hour, and they take about twenty minutes. If the weather is wet, the rides are cancelled, and you can get a refund at the ticket office.",
"Tom: A word about dogs. We know many of you like to bring them, and they're welcome on the nature trail, but they're not allowed in any of the animal areas, even on a lead. There's a kennel by the entrance if you'd prefer to leave your dog while you look around.",
"Tom: Now, some of the highlights of the day. Feeding time for the goats is at half past two, and children love to help. The café's speciality is homemade soup, made with vegetables from our own garden, and it's very good value.",

{title:'Section 3 — Student research project',type:'Multiple choice',
cast:{'Dr Patel':'f',Maya:'f',Ethan:'m'},
ins:'Choose the correct letter, A, B or C.',
script:[
"Dr Patel: Come in, Maya, Ethan. So, you wanted to discuss your project on teenagers and sleep.",
"Maya: Yes. I chose the topic mainly because of my younger brother. He's fourteen, and he's been staying up until two in the morning on his phone. I'd seen a documentary about it, but it was his situation that really made me curious.",
"Ethan: We're planning to survey students at the local secondary school. At the moment we have forty volunteers.",
"Dr Patel: Forty is fine for a pilot study, but it's too small to draw reliable conclusions. I'd aim for at least a hundred.",
"Ethan: Right. We'll ask the school if more classes can take part.",
"Dr Patel: How do you plan to collect the data?",
"Ethan: An online questionnaire is the quickest, and most of the data will come from that.",
"Maya: But I'm worried people won't be honest about what time they go to bed.",
"Dr Patel: A good point. That's why I'd suggest sleep diaries as well, but only for a small group of volunteers, maybe ten or fifteen, over two weeks. You can compare the diaries with the questionnaire answers.",
"Maya: And I want to avoid leading questions. For example, instead of asking 'Don't you think social media ruins your sleep?', we should just ask how many hours they spend online after nine.",
"Dr Patel: Exactly. Now, you need to submit the ethics form by next Friday, not Monday as it says on the website. The website hasn't been updated.",
"Ethan: Do we need permission from parents?",
"Dr Patel: Yes. The pupils are under sixteen, so you need written parental consent. The headteacher's permission alone isn't enough.",
"Ethan: Understood. And for the analysis, should we use specialist software?",
"Dr Patel: There's no need. Excel will do everything you need for a project this size.",
"Maya: What about the presentation? How long should it be?",
"Dr Patel: Fifteen minutes, followed by five minutes of questions.",
"Dr Patel: I'll email you a sample consent form this afternoon, and you can adapt it. I won't send a reading list; you've already found plenty of articles.",
"Maya: Thank you, that's really helpful."],
qs:[

M('What does Dr Patel say about a sample of forty students?',['It is enough for a final study.','It is too small for reliable conclusions.','It is too varied.'],1,'"too small to draw reliable conclusions".'),
M('Most of the data will be collected by',['online questionnaire.','face-to-face interviews.','sleep diaries.'],0,'"most of the data will come from that" (questionnaire).'),
M('Dr Patel recommends sleep diaries for',['all participants.','a small group of volunteers.','the teachers.'],1,'"only for a small group of volunteers".'),
M('What does Maya want to avoid?',['Long questionnaires','Leading questions','Asking about age'],1,'"I want to avoid leading questions".'),
M('The ethics form must be submitted by',['Monday.','Wednesday.','Friday.'],2,'"by next Friday, not Monday".'),
M('Before surveying the pupils, they need',['the headteacher\'s permission only.','written parental consent.','a university licence.'],1,'"written parental consent".'),
M('For analysing the data they should use',['specialist software.','Excel.','a programming language.'],1,'"Excel will do everything you need".'),

{title:'Section 4 — Lecture: the bicycle and society',type:'Note completion',
cast:{Lecturer:'m'},
ins:'Complete the notes. Write NO MORE THAN TWO WORDS for each answer.',
script:[
"Lecturer: Today I'd like to talk about what I call the silent revolution: how the humble bicycle changed society.",
"Lecturer: The story begins in eighteen seventeen, when the German inventor Karl von Drais built his 'running machine'. It had two wheels, but no pedals; riders simply pushed themselves along with their feet.",
"Lecturer: In the eighteen sixties, pedals were added to the front wheel. This machine was nicknamed the 'boneshaker', because its frame was made of wood and iron, and the ride on cobbled streets was extremely uncomfortable.",
"Lecturer: In the eighteen seventies came the penny-farthing, with a huge front wheel. It was fast, but dangerous, since riders sat high above the ground.",
"Lecturer: The real breakthrough was the safety bicycle of eighteen eighty-five, in which a chain drove the rear wheel. Three years later, John Dunlop produced tyres filled with air, which made rides much smoother.",
"Lecturer: By the eighteen nineties there was a cycling boom, and its social impact was enormous. For many women, the bicycle offered independence for the first time. It also led to changes in women's clothing, as long skirts were impractical for cycling.",
"Lecturer: Cycling clubs also lobbied governments for better roads, which later benefited motorists as well.",
"Lecturer: During the twentieth century, the car took over in most countries, but in the nineteen seventies the oil crisis led to a revival of interest in cycling. More recently, concern about pollution has given cycling another boost.",
"Lecturer: Today, in Copenhagen, around forty-five per cent of commuters travel to work or school by bicycle. Many city planners now see Copenhagen as a model. In the next part of the lecture, we'll look at how it achieved this."],
qs:[
G('Von Drais\'s machine had no ___',['pedals','pedal'],'"two wheels, but no pedals".'),
G('The boneshaker\'s frame was made of ___ and iron',['wood'],'"made of wood and iron".'),
G('The penny-farthing had a huge front ___',['wheel'],'"a huge front wheel".'),
G('On the safety bicycle, a ___ drove the rear wheel',['chain'],'"a chain drove the rear wheel".'),
G('Dunlop\'s tyres were filled with ___',['air'],'"tyres filled with air".'),
G('Cycling gave women ___',['independence','freedom'],'"offered independence for the first time".'),
G('Cycling changed women\'s ___',['clothing','clothes','dress'],'"changes in women\'s clothing".'),
G('Cycling clubs lobbied for better ___',['roads','road'],'"lobbied governments for better roads".'),
G('Cycling revived in the 1970s because of the ___ crisis',['oil'],'"the oil crisis".'),
G('In Copenhagen about ___ per cent of commuters cycle',['45','forty-five','forty five'],'"around forty-five per cent".')]}
]},

{title:'Section 3 — Group presentation on tidal power',type:'Multiple choice',
cast:{Hannah:'f',Lucas:'m'},
ins:'Choose the correct letter, A, B or C.',
script:[
"Hannah: Right, Lucas, we need to decide how to organise the presentation on tidal power.",
"Lucas: I think we should begin with a short history. I was surprised to find that tide mills were used in Britain as early as the eleventh century.",
"Hannah: That's interesting, but we only have twelve minutes, so the history should be no more than two. I'd rather spend most of the time on the advantages and the disadvantages.",
"Lucas: Agreed. The biggest advantage is that tides are completely predictable, unlike wind or solar power.",
"Hannah: And the main disadvantage is cost. The barrage in the case study I read cost nearly a billion pounds.",
"Lucas: What about the environmental effects? I read that barrages can damage the habitat of fish and birds.",
"Hannah: Yes, but some newer turbines sit on the sea floor and have much less impact. I'd like to include that, because it shows the technology is improving.",
"Lucas: Good idea. Should we use a video?",
"Hannah: A short animation would be better than a video. I found one that shows how a turbine works, and it's only forty seconds long.",
"Lucas: Great. Who will do which part? I'm better at the technical side, so I could do the explanation of how the turbines work.",
"Hannah: Fine, and I'll take the economic section and the conclusion. Let's both do the introduction together.",
"Lucas: And the slides? I'll make them if you send me your notes by Thursday.",
"Hannah: Thursday's difficult. I have a lab report due. Can I send them on Friday morning?",
"Lucas: That's cutting it fine, but all right. We can practise on Friday afternoon, in the seminar room.",
"Hannah: Perfect. I'll book it now."],
qs:[
M('How many minutes does the presentation last?',['Ten','Twelve','Fifteen'],1,'"we only have twelve minutes".'),
M('How long should the history section be?',['No more than two minutes','About five minutes','Ten minutes'],0,'"no more than two".'),
M('Lucas says the greatest advantage of tidal power is that it is',['cheap.','predictable.','quiet.'],1,'"tides are completely predictable".'),
M('According to Hannah, the main disadvantage is',['cost.','noise.','lack of sites.'],0,'"the main disadvantage is cost".'),
M('Hannah wants to mention sea-floor turbines because they',['are cheaper.','generate more power.','show the technology is improving.'],2,'"it shows the technology is improving".'),
M('They decide to use',['a video.','a short animation.','a live demonstration.'],1,'"A short animation would be better than a video".'),
M('Lucas will explain',['how turbines work.','the economics.','the history.'],0,'"the explanation of how the turbines work".'),
M('Who will write the conclusion?',['Lucas','Hannah','Both of them'],1,'"I\'ll take the economic section and the conclusion".'),
M('Hannah will send her notes on',['Wednesday.','Thursday.','Friday.'],2,'"on Friday morning".'),
M('They will practise',['in the library.','in the seminar room.','online.'],1,'"in the seminar room".')]},

{title:'Section 4 — Lecture: sleep and memory',type:'Note completion',
cast:{Lecturer:'f'},
ins:'Complete the notes. NO MORE THAN TWO WORDS AND/OR A NUMBER.',
script:[
"Lecturer: In today's lecture, I'm going to look at the relationship between sleep and memory.",
"Lecturer: Sleep is not a single state. During the night we pass through several cycles, each lasting about ninety minutes, and each containing light sleep, deep sleep and a stage called REM sleep, when most dreaming occurs.",
"Lecturer: Researchers believe that during deep sleep the brain replays the events of the day, strengthening the connections that store new information. In one experiment, twenty students learned a list of word pairs in the evening. Half of them slept normally; the other half stayed awake all night. Two days later, both groups were tested, and the students who had slept recalled around forty per cent more pairs.",
"Lecturer: Even short naps can help. A nap of ninety minutes, which allows a full cycle, improved performance on a learning task more than a nap of twenty minutes did.",
"Lecturer: Most adults need between seven and nine hours of sleep a night. But many people sleep badly because of habits which are easy to change. Caffeine, for example, stays in the body for around six hours, so a coffee at four in the afternoon can still affect you at bedtime.",
"Lecturer: Another factor is blue light from screens, which suppresses melatonin, the hormone that makes us feel sleepy. Experts recommend switching off devices an hour before bed.",
"Lecturer: Finally, the bedroom itself matters. The ideal room temperature for sleep is around eighteen degrees Celsius, and the room should be as dark and quiet as possible.",
"Lecturer: In the next lecture, we'll look at sleep disorders, such as insomnia."],
qs:[
G('Each sleep cycle lasts about ___ minutes',['90','ninety'],'"about ninety minutes".'),
G('Most dreaming occurs during ___ sleep',['REM','rem'],'"a stage called REM sleep".'),
G('During deep sleep the brain ___ the day\'s events',['replays','replay'],'"the brain replays the events of the day".'),
G('The experiment had ___ students',['20','twenty'],'"twenty students".'),
G('Students who slept recalled about ___ per cent more',['40','forty'],'"around forty per cent more pairs".'),
G('A ___-minute nap was more effective than a 20-minute one',['90','ninety'],'"A nap of ninety minutes".'),
G('Adults need ___ hours of sleep (lower figure)',['7','seven'],'"between seven and nine hours".'),
G('Caffeine stays in the body for about ___ hours',['6','six'],'"around six hours".'),
G('Blue light suppresses ___',['melatonin'],'"suppresses melatonin".'),
G('Ideal bedroom temperature: ___ degrees Celsius',['18','eighteen'],'"around eighteen degrees Celsius".')]}
]}
];

const KB=[
{id:'hello',k:['salom','assalom','hello','hi ','hey','qalay','yaxshimisiz'],a:'<p>Assalomu alaykum! Men <b>Khabib AI</b> — IELTS bo\'yicha oflayn yordamchingizman. Menga Listening, Reading, Writing, Speaking, grammatika yoki lug\'at haqida savol bering. Insho matnini tashlasangiz, tekshirib beraman.</p>'},
{id:'about',k:['kimsan','sen kim','who are you','nima qila olasan','nimalar qila','imkoniyat','help','yordam'],a:'<p>Men internetsiz ishlaydigan, qoidalarga asoslangan IELTS yordamchisiman. Quyidagilarni qila olaman:</p><ul><li>IELTS bo\'limlari bo\'yicha strategiya va maslahat</li><li>Insho (Writing) matnini tekshirish: matnni shu yerga tashlang yoki <code>/check</code> deb boshlang</li><li>Inglizcha gapni xatolarga tekshirish: <code>tuzat: gapingiz</code></li><li>So\'z ma\'nosi: <code>accumulate nima</code>, sinonim: <code>sinonim important</code></li><li>Ball hisoblash: <code>listening 32 ta to\'g\'ri</code></li><li>O\'qish rejasi: <code>reja 6.5 8 hafta</code></li></ul>'},
{id:'band',k:['band','ball nima','scoring','baholash','qanday baholanadi','band descriptor','9 band'],a:'<p>IELTS 0 dan 9 gacha band bilan baholanadi. Umumiy ball 4 ta bo\'lim o\'rtachasi (0.5 ga yaxlitlanadi).</p><ul><li><b>Listening/Reading:</b> 40 ta savol, to\'g\'ri javoblar soniga qarab band beriladi (masalan, Academic Reading 30 ta = 7.0, Listening 30 ta = 7.0).</li><li><b>Writing:</b> Task Response, Coherence, Lexical Resource, Grammar — 4 mezon.</li><li><b>Speaking:</b> Fluency, Lexical Resource, Grammar, Pronunciation — 4 mezon.</li></ul>'},
{id:'listen',k:['listening','tinglash','audio','eshitish'],a:'<p><b>Listening strategiyasi:</b></p><ul><li>Audio boshlanishidan oldin savollarni o\'qing va <b>kalit so\'zlarni</b> (ism, son, sana, joy) belgilang.</li><li>Javob odatda savol tartibida keladi. Yo\'qotib qo\'ysangiz, keyingi savolga o\'ting.</li><li>Distraktorlarga e\'tibor bering: "Actually...", "No, I meant..." — javob ko\'pincha tuzatishdan keyin keladi.</li><li>Imlo: so\'z xato yozilsa, ball berilmaydi. Raqam va sanalarni diqqat bilan yozing.</li><li>Gap bo\'sh joyga grammatik mos kelishi kerak (son/ko\'plik).</li><li>Kundalik mashq: 20 daqiqa dictation + 1 ta section.</li></ul>'},
{id:'listen_spell',k:['spelling','imlo','harflab','spell','number','raqam','sana yozish'],a:'<p>Listening\'da ko\'p xato <b>imlo</b> va <b>raqam</b>dan chiqadi. Maslahatlar: ingliz alifbosini harflab o\'rganing (A=ey, E=i:, I=ay, G=ji:, J=jey); 13/30, 15/50 kabi juftliklarni farqlang (thir<b>teen</b> – thir<b>ty</b>); "double five" = 55; British imlo (colour, centre) hamda American imlo ikkalasi ham qabul qilinadi.</p>'},
{id:'read',k:['reading','o\'qish','oqish','passage','matn','vaqt yetmayapti'],a:'<p><b>Reading strategiyasi (60 daqiqa, 3 ta matn):</b></p><ul><li>Har matnga ~20 daqiqa. Qiyin savolda to\'xtab qolmang.</li><li>Avval savollarga qarang, so\'ng <b>skimming</b> (sarlavha, birinchi gaplar) bilan matn tuzilishini tushuning.</li><li>Kalit so\'zlarni toping — lekin matnda ular <b>paraphrase</b> qilingan bo\'ladi (increase → rise, grow).</li><li>Savollar odatda matn tartibida keladi (Matching Headings bundan mustasno).</li><li>Javoblarni aynan matndan ko\'chiring, so\'z limitiga rioya qiling (NO MORE THAN TWO WORDS).</li></ul>'},
{id:'tfng',k:['true false','not given','tfng','yes no','ng '],a:'<p><b>TRUE / FALSE / NOT GIVEN:</b></p><ul><li><b>TRUE</b> — matn bilan bir xil ma\'no.</li><li><b>FALSE</b> — matn aksini aytadi (qarama-qarshilik bor).</li><li><b>NOT GIVEN</b> — matnda bu haqda ma\'lumot yo\'q; o\'zingizning bilimingizdan foydalanmang.</li><li>Maslahat: avval matndan tegishli joyni toping. Topilmasa — NOT GIVEN. Topilib, ma\'no qarama-qarshi bo\'lsa — FALSE.</li><li>"all, never, only, most" kabi so\'zlarga ehtiyot bo\'ling.</li></ul>'},
{id:'headings',k:['matching headings','heading','sarlavha moslashtirish','matching'],a:'<p><b>Matching Headings:</b> avval barcha sarlavhalarni o\'qing, so\'ng har paragrafning <i>asosiy fikri</i>ni toping (odatda birinchi va oxirgi gap). Misol va tafsilotlarga aldanmang. Ortiqcha sarlavhalar bor — bittasi bir marta ishlatiladi.</p>'},
{id:'write1',k:['task 1','writing task 1','grafik','chart','diagram','report'],a:'<p><b>Writing Task 1 (20 daqiqa, 150+ so\'z):</b></p><ol><li><b>Kirish</b> — savolni paraphrase qiling (1–2 gap).</li><li><b>Overview</b> — 2–3 ta asosiy tendensiya, raqamsiz. Bu eng muhim qism!</li><li><b>Body 1</b> — birinchi guruh ma\'lumotlari, raqamlar bilan.</li><li><b>Body 2</b> — ikkinchi guruh va taqqoslash.</li></ol><p>Fe\'llar: rise, climb, fall, drop, remain stable, fluctuate. Shaxsiy fikr bildirmang. Zamon ma\'lumot davriga mos bo\'lsin.</p>'},
{id:'write2',k:['task 2','essay','insho','writing task 2','inshoni','structure'],a:'<p><b>Writing Task 2 (40 daqiqa, 250+ so\'z):</b></p><ol><li><b>Kirish:</b> mavzuni paraphrase + tezis (fikringiz).</li><li><b>Body 1:</b> birinchi asosiy fikr + izoh + misol.</li><li><b>Body 2:</b> ikkinchi fikr yoki qarama-qarshi nuqtai nazar + misol.</li><li><b>Xulosa:</b> fikrni qisqa takrorlash, yangi g\'oya yo\'q.</li></ol><p>Savol turlariga (opinion, discussion, problem-solution, two-part) <b>to\'liq javob bering</b>. Shaxsiy misol bo\'lsa-da, rasmiy uslubda yozing (qisqartmalarsiz).</p>'},
{id:'linking',k:['linking','bog\'lovchi','bog\'lovchi so\'z','however','moreover','connector','coherence','cohesion'],a:'<p><b>Linking words (kohezi):</b></p><ul><li>Qo\'shish: moreover, furthermore, in addition</li><li>Qarama-qarshilik: however, nevertheless, whereas, on the other hand</li><li>Sabab/natija: therefore, consequently, as a result, owing to</li><li>Misol: for instance, such as, a case in point</li><li>Xulosa: in conclusion, to sum up</li></ul><p>Ularni haddan ortiq ishlatmang — har gapda emas, mantiqiy joylarda.</p>'},
{id:'opinion_ess',k:['opinion essay','agree disagree','to what extent','fikringizni'],a:'<p><b>Opinion (agree/disagree):</b> kirishda pozitsiyangizni aniq ayting ("I strongly agree that..."). Har body bitta sababni ochsin. Xulosada pozitsiyani qayta tasdiqlang. Qisman rozilik bo\'lsa — buni oldindan aytib, izchil saqlang.</p>'},
{id:'speak',k:['speaking','gapirish','suhbat','speaking test'],a:'<p><b>Speaking (11–14 daqiqa):</b></p><ul><li><b>Part 1:</b> kundalik mavzular. Javob 2–3 gap: javob + sabab + misol.</li><li><b>Part 2:</b> 1 daqiqa tayyorgarlik, 1–2 daqiqa monolog. Cue card nuqtalariga rioya qiling, qisqa belgi yozing.</li><li><b>Part 3:</b> mavhum muhokama. Fikr → sabab → misol → taqqoslash.</li></ul><p>Pauza bo\'lsa, "Well, that\'s an interesting question..." kabi iboralar ishlating. Sukut saqlamang, tabiiy gapiring. Yodlangan javoblar ballni tushiradi.</p>'},
{id:'fluency',k:['fluency','ravon','ravonlik','to\'xtab qolaman','um uh'],a:'<p><b>Fluency uchun:</b> har kuni 5 daqiqa o\'zingiz bilan mavzu bo\'yicha gapiring va yozib oling (Speaking bo\'limidagi yozuv funksiyasi). "Um/uh" o\'rniga to\'ldiruvchi iboralar: "Let me think...", "Well,...". Fikr tugamasa ham gapni tugatmay, boshqacha ifoda bilan davom eting.</p>'},
{id:'pron',k:['pronunciation','talaffuz','intonation','stress','urg\'u'],a:'<p><b>Pronunciation:</b> so\'z urg\'usi (<i>de-VEL-op</i>), gap intonatsiyasi va bog\'lanish (linking) muhim. Alohida tovushlardan ko\'ra ritm ko\'proq ball beradi. Texnika: shadowing — audio eshitib, ketidan darhol takrorlang (Listening bo\'limidagi matnlardan foydalaning).</p>'},
{id:'vocab',k:['vocabulary','lug\'at','so\'z yodlash','vocab','so\'z boyligi','collocation'],a:'<p><b>Lug\'at o\'rganish:</b> alohida so\'z emas, <b>collocation</b> bilan o\'rganing (make a decision, heavy traffic). Kuniga 10 ta so\'z, 3 kundan so\'ng takrorlash (spaced repetition). Khabib\'s ichidagi <b>Lug\'at</b> bo\'limida kartochkalar va test bor. Har so\'z uchun o\'z gapingizni yozing.</p>'},
{id:'paraphrase',k:['paraphrase','parafraz','qayta ifodalash'],a:'<p><b>Paraphrase usullari:</b> 1) sinonim (increase → rise); 2) so\'z turini o\'zgartirish (the growth of → grow); 3) gap tuzilishini o\'zgartirish (active ↔ passive); 4) birikmalar (a large number of → many). Sinonim topish uchun yozing: <code>sinonim important</code>.</p>'},
{id:'present_perfect',k:['present perfect','have done','has done','for since'],a:'<p><b>Present Perfect (have/has + V3):</b> o\'tmishdan hozirgacha ta\'sir qiladigan ish yoki tajriba. <i>I have lived here for 5 years.</i> "yesterday, in 2010" bilan ishlatilmaydi. <b>for</b> = davomiylik, <b>since</b> = boshlanish nuqtasi.</p>'},
{id:'tenses',k:['tenses','zamonlar','zamon','past simple','present simple','future'],a:'<p>Inglizcha asosiy zamonlar: Present Simple (odat), Present Continuous (hozir), Past Simple (tugagan o\'tmish), Present Perfect (hozirgacha), Past Perfect (o\'tmishdagi ishdan oldin), Future (will/going to). Writing Task 1da zamon ma\'lumot davriga mos bo\'lishi kerak. Daraja testini ishlab, qaysi zamonlarda xato qilayotganingizni bilib oling.</p>'},
{id:'articles',k:['article','artikl','a an the','the ishlatish'],a:'<p><b>Artikllar:</b> <b>a/an</b> — noma\'lum, sanaladigan birlik ot; <b>the</b> — aniq yoki ma\'lum narsa, yagona narsa (the sun); umumiy ko\'plik/sanalmaydigan otlar oldida artikl yo\'q (<i>People need water</i>). Mamlakat nomlari (Uzbekistan) oldida "the" yo\'q, lekin the UK, the USA.</p>'},
{id:'conditionals',k:['conditional','shart gap','if clause','wish'],a:'<p><b>Conditionals:</b> Zero (If + present, present — haqiqat); First (If + present, will — real kelajak); Second (If + past, would — xayoliy hozir); Third (If + had V3, would have V3 — o\'tmishdagi afsus). Ikkinchi shartda "were" ishlatish rasmiyroq.</p>'},
{id:'passive',k:['passive','majhul','passive voice'],a:'<p><b>Passive:</b> be + V3. Jarayon (Task 1 process) va ob\'ekt muhim bo\'lganda ishlating: <i>The paper is sorted and pressed.</i> Har gapda emas — aralash ishlating.</p>'},
{id:'relative',k:['relative clause','who which that','whose'],a:'<p><b>Relative clauses:</b> who (odam), which (narsa), that (aniqlovchi), whose (egalik). Vergul bilan ajratilgan qo\'shimcha ma\'lumotda <i>that</i> ishlatilmaydi: <i>The report, which was published in May, ...</i></p>'},
{id:'complex',k:['murakkab gap','complex sentence','compound','gap tuzilishi','sentence variety'],a:'<p>Grammatik diapazon uchun (GRA 7+) aralash gaplar: <i>Although...</i>, <i>While...</i>, shart gaplar, relative clauses, passive va participle iboralar (<i>Having analysed the data, ...</i>). Lekin aniqlik muhim: xatosiz oddiy gap xatoli murakkab gapdan yaxshi.</p>'},
{id:'time',k:['vaqt','time management','time','vaqtni taqsimlash'],a:'<p><b>Vaqt taqsimoti:</b> Listening 30 daq + 10 daq ko\'chirish (qog\'ozda); Reading 60 daq (3×20); Writing 60 daq (Task 1: 20, Task 2: 40 — Task 2 ball og\'irligi ikki baravar); Speaking 11–14 daq.</p>'},

const fmtDate=ts=>{const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())};

function addResult(r){const h=getHistory();r.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);r.ts=Date.now();h.push(r);Store.set('history',h);

function streak(){const days=Store.get('days',[]).slice().sort();if(!days.length)return 0;let n=0;let d=new Date();d.setHours(12);
  const key=x=>x.toISOString().slice(0,10);
  if(!days.includes(key(d))){d.setDate(d.getDate()-1);if(!days.includes(key(d)))return 0}
  while(days.includes(key(d))){n++;d.setDate(d.getDate()-1)}return n}

/* ===== IndexedDB for recordings ===== */
const DB={
  _db:null,
  open(){return new Promise((res,rej)=>{if(this._db)return res(this._db);if(!window.indexedDB)return rej(new Error('IndexedDB yo\'q'));
    const r=indexedDB.open('khabibs',1);r.onupgradeneeded=()=>{r.result.createObjectStore('rec',{keyPath:'id'})};
    r.onsuccess=()=>{this._db=r.result;res(r.result)};r.onerror=()=>rej(r.error)})},
  async put(o){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('rec','readwrite');t.objectStore('rec').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async all(){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('rec').objectStore('rec').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async del(id){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('rec','readwrite');t.objectStore('rec').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};

/* ===== Timer ===== */
function makeTimer(seconds,el,onEnd){
  let left=seconds,h=null;
  const draw=()=>{el.textContent=fmtTime(left);el.classList.toggle('low',left<=60)};
  draw();
  const t={start(){if(h)return;h=setInterval(()=>{left--;draw();if(left<=0){t.stop();onEnd&&onEnd()}},1000)},stop(){clearInterval(h);h=null},left:()=>left,reset(s){left=s;draw()}};
  onLeave(()=>t.stop());return t}

/* ===== Text-to-speech (offline in most browsers) ===== */
const TTS={
  voices:[],supported:'speechSynthesis' in window,
  init(){if(!this.supported)return;const load=()=>{this.voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));};load();speechSynthesis.onvoiceschanged=load},
  pickVoice(role,idx){const vs=this.voices;if(!vs.length)return null;
    const fem=/female|zira|hazel|susan|samantha|karen|moira|tessa|fiona|victoria|kate|serena|libby|sonia|aria|jenny|emma|amy|ava|allison|catherine/i;
    const mal=/(^|\s)male|david|mark|george|daniel|alex|fred|oliver|ryan|guy|james|thomas|richard|arthur|brian|liam|davis|tom/i;
    const gb=vs.filter(v=>/GB|UK/i.test(v.lang)||/british|uk/i.test(v.name));
    const pool=gb.length>1?gb:vs;
    let c=pool.filter(v=>role==='f'?fem.test(v.name):mal.test(v.name));
    if(!c.length)c=vs.filter(v=>role==='f'?fem.test(v.name):mal.test(v.name));
    if(!c.length)c=pool;
    const saved=Store.get('voice',''); if(saved&&role!=='f'&&role!=='m'){const s=vs.find(v=>v.name===saved);if(s)return s}
    return c[(idx||0)%c.length]||pool[0]}
};
TTS.init();

function splitSentences(t){return t.match(/[^.!?]+[.!?]+["')\]]*|\S[^.!?]*$/g)||[t]}
class Player{
  constructor(lines,cast,ui){
    this.items=[];this.ui=ui||{};this.state='idle';this.i=0;this.tok=0;this.rate=0.92;
    const names=Object.keys(cast||{});
    lines.forEach(l=>{const m=l.match(/^([^:]{1,24}):\s*(.*)$/);const sp=m?m[1]:'';const txt=m?m[2]:l;
      splitSentences(txt).forEach((s,j,arr)=>{const t=s.trim();if(t)this.items.push({sp,t,last:j===arr.length-1})})});
    this.cast=cast||{};this.names=names}
  setRate(r){this.rate=r}
  total(){return this.items.length}
  play(){if(this.state==='playing')return;if(!TTS.supported){this.ui.error&&this.ui.error('Bu brauzerda ovoz sintezi yo\'q. Matnni o\'qish rejimidan foydalaning.');return}
    if(this.state==='done')this.i=0;this.state='playing';this.ui.state&&this.ui.state('playing');this.step()}
  step(){if(this.state!=='playing')return;if(this.i>=this.items.length){this.state='done';this.ui.state&&this.ui.state('done');this.ui.progress&&this.ui.progress(1);return}
    const it=this.items[this.i];const tok=++this.tok;const u=new SpeechSynthesisUtterance(it.t);
    const role=this.cast[it.sp]||'m';const idx=Math.max(0,this.names.indexOf(it.sp));
    const v=TTS.pickVoice(role,idx);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';
    u.rate=this.rate;u.pitch=role==='f'?1.12:(role==='m'?0.88:1);
    let finished=false;const next=gap=>{if(finished||tok!==this.tok)return;finished=true;this.i++;this.ui.progress&&this.ui.progress(this.i/this.items.length);setTimeout(()=>this.step(),gap)};
    u.onend=()=>next(it.last?450:120);u.onerror=e=>{if(tok!==this.tok)return;next(50)};
    this.guard=setTimeout(()=>{if(!finished&&tok===this.tok&&!speechSynthesis.speaking)next(50)},4000+it.t.length*160);
    try{speechSynthesis.speak(u)}catch(e){this.ui.error&&this.ui.error('Ovozni ijro etib bo\'lmadi')}}
  pause(){if(this.state!=='playing')return;this.state='paused';this.tok++;speechSynthesis.cancel();this.ui.state&&this.ui.state('paused')}
  stop(){this.tok++;this.state='idle';this.i=0;try{speechSynthesis.cancel()}catch(e){}this.ui.state&&this.ui.state('idle');this.ui.progress&&this.ui.progress(0)}
  destroy(){this.tok++;this.state='idle';try{speechSynthesis.cancel()}catch(e){}}
}

/* ===== SVG charts ===== */
const PALETTE=['#0b5fff','#f5a524','#12a150','#e5484d','#8b5cf6','#06b6d4'];
function svgBar(d){const W=560,H=300,pl=44,pb=40,pt=20,pr=10;const max=Math.max(...d.series.flatMap(s=>s.v))*1.15;const n=d.cats.length,sn=d.series.length;
  const gw=(W-pl-pr)/n;const bw=Math.min(36,gw/(sn+1));let o=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:12px">`;
  for(let i=0;i<=5;i++){const y=pt+(H-pt-pb)*(1-i/5);o+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#8a94b3" stroke-opacity=".25"/><text x="${pl-6}" y="${y+4}" font-size="11" text-anchor="end" fill="#8a94b3">${Math.round(max*i/5)}</text>`}
  d.cats.forEach((c,i)=>{const x0=pl+i*gw+(gw-bw*sn)/2;d.series.forEach((s,j)=>{const h=(H-pt-pb)*s.v[i]/max;o+=`<rect x="${x0+j*bw}" y="${H-pb-h}" width="${bw-2}" height="${h}" fill="${PALETTE[j]}" rx="3"><title>${esc(s.n)}: ${s.v[i]}${d.unit||''}</title></rect>`});
    o+=`<text x="${pl+i*gw+gw/2}" y="${H-pb+16}" font-size="12" text-anchor="middle" fill="#8a94b3">${esc(c)}</text>`});
  d.series.forEach((s,j)=>{o+=`<rect x="${pl+j*90}" y="4" width="10" height="10" fill="${PALETTE[j]}"/><text x="${pl+j*90+14}" y="13" font-size="12" fill="#8a94b3">${esc(s.n)}</text>`});
  return o+`<text x="8" y="${H/2}" font-size="11" fill="#8a94b3" transform="rotate(-90 8 ${H/2})" text-anchor="middle">${esc(d.unit||'')}</text></svg>`}
function svgLine(d,opts){opts=opts||{};const W=opts.W||560,H=opts.H||300,pl=44,pb=34,pt=24,pr=14;const all=d.series.flatMap(s=>s.v.filter(v=>v!=null));let mn=opts.min!=null?opts.min:Math.min(0,...all),mx=opts.max!=null?opts.max:Math.max(...all);if(mx===mn)mx=mn+1;const pad=(mx-mn)*.08;if(opts.max==null)mx+=pad;if(opts.min==null&&mn<0)mn-=pad;
  const n=d.cats.length;const X=i=>pl+(n===1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1));const Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let o=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${opts.maxw||640}px;background:var(--card);border:1px solid var(--line);border-radius:12px">`;
  for(let i=0;i<=5;i++){const v=mn+(mx-mn)*i/5;const y=Y(v);o+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#8a94b3" stroke-opacity=".25"/><text x="${pl-6}" y="${y+4}" font-size="11" text-anchor="end" fill="#8a94b3">${(Math.round(v*10)/10)}</text>`}
  const step=Math.ceil(n/12);d.cats.forEach((c,i)=>{if(i%step===0)o+=`<text x="${X(i)}" y="${H-pb+16}" font-size="11" text-anchor="middle" fill="#8a94b3">${esc(c)}</text>`});
  d.series.forEach((s,j)=>{const col=s.color||PALETTE[j];let path='';s.v.forEach((v,i)=>{if(v==null)return;path+=(path?'L':'M')+X(i)+' '+Y(v)});o+=`<path d="${path}" fill="none" stroke="${col}" stroke-width="2.5"/>`;s.v.forEach((v,i)=>{if(v!=null)o+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${col}"><title>${esc(s.n)}: ${v}</title></circle>`})});
  d.series.forEach((s,j)=>{o+=`<rect x="${pl+j*90}" y="4" width="10" height="10" fill="${s.color||PALETTE[j]}"/><text x="${pl+j*90+14}" y="13" font-size="12" fill="#8a94b3">${esc(s.n)}</text>`});
  return o+'</svg>'}
function svgPie(d){const W=420,H=280,cx=140,cy=140,r=110;const tot=d.items.reduce((a,b)=>a+b.v,0);let a0=-Math.PI/2;let o=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:12px">`;
  d.items.forEach((it,i)=>{const a1=a0+it.v/tot*2*Math.PI;const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);o+=`<path d="M${cx} ${cy}L${x0} ${y0}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}Z" fill="${PALETTE[i%6]}" stroke="#fff"><title>${esc(it.n)}: ${it.v}%</title></path>`;
    const am=(a0+a1)/2;o+=`<text x="${cx+r*.62*Math.cos(am)}" y="${cy+r*.62*Math.sin(am)+4}" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">${it.v}%</text>`;
    o+=`<rect x="285" y="${30+i*28}" width="12" height="12" fill="${PALETTE[i%6]}"/><text x="303" y="${41+i*28}" font-size="13" fill="#8a94b3">${esc(it.n)}</text>`;a0=a1});return o+'</svg>'}
function renderTask1Visual(t){
  if(t.type==='bar')return svgBar(t);if(t.type==='line')return svgLine(t,{min:t.cats.length&&Math.min(0,...t.series.flatMap(s=>s.v))});if(t.type==='pie')return svgPie(t);
  if(t.type==='table')return `<table class="t"><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
  if(t.type==='process')return `<ol style="padding-left:20px">${t.steps.map(s=>`<li style="margin:6px 0"><div class="note good" style="margin:0">${esc(s)}</div></li>`).join('')}</ol>`;
  return ''}

/* ===== Listening & Reading runner ===== */
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[£$€]/g,'').replace(/\s+/g,' ').trim().replace(/[.,;:!?]+$/,'');
const squish=s=>norm(s).replace(/[^a-z0-9]/g,'');
function checkGap(user,answers){let u=squish(user);if(!u)return false;const alts=answers.map(squish);if(alts.includes(u))return true;
  const stripped=norm(user).replace(/^(the|a|an)\s+/,'');u=squish(stripped);return alts.includes(u)}
const READ_FULL=[{id:'RA',title:'Reading Practice Test A — Full',ids:['R1','R2','R3']},{id:'RB',title:'Reading Practice Test B — Full',ids:['R4','R5','R6']}];

function qHTML(item,n){const q=item;let body='';
  if(q.t==='mcq'){body=`<p>${esc(q.q)}</p>`+q.o.map((o,i)=>`<label class="opt"><input type="radio" name="q${n}" value="${i}"> <b>${'ABCD'[i]}</b> &nbsp;${esc(o)}</label>`).join('')}
  else if(q.t==='tf'){body=`<p>${esc(q.q)}</p>`+['TRUE','FALSE','NOT GIVEN'].map(o=>`<label class="opt"><input type="radio" name="q${n}" value="${o}"> ${o}</label>`).join('')}
  else{const inp=`<input class="gap" type="text" name="q${n}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Savol ${n}">`;
    body=q.q.includes('___')?`<p>${esc(q.q).replace('___',inp)}</p>`:`<p>${esc(q.q)} ${inp}</p>`}
  return `<div class="q" data-n="${n}"><div class="qn">${n}</div><div class="qb">${body}<div class="rev-slot"></div></div></div>`}

function buildDef(kind,id,sel){
  if(kind==='reading'){
    const full=READ_FULL.find(f=>f.id===id);const ids=full?full.ids:[id];const ps=ids.map(i=>READING.find(p=>p.id===i)).filter(Boolean);if(!ps.length)return null;
    return{module:'reading',id,title:full?full.title:ps[0].title+' ('+ps[0].level+')',minutes:ps.length*20,full:!!full,
      sections:ps.map(p=>({title:p.title,sub:p.level,text:p.text,groups:p.groups}))}}
  const T=LISTENING.find(t=>t.id===id);if(!T)return null;
  const secs=(sel==='all'||sel==null)?T.sections:[T.sections[+sel]];if(!secs[0])return null;
  const full=sel==='all'||sel==null;
  return{module:'listening',id:id+'-'+sel,title:full?T.title+' — Full (4 sections)':T.title+' · '+secs[0].title,minutes:0,full,
    sections:secs.map(s=>({title:s.title,sub:s.type,script:s.script,cast:s.cast,groups:[{ins:s.ins,qs:s.qs}]}))}}

function analyzeWriting(text,task){
  const raw=String(text||'').trim();const words=raw.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[];const wc=words.length;const lw=words.map(w=>w.toLowerCase());
  const sents=(raw.match(/[^.!?]+[.!?]*/g)||[]).map(s=>s.trim()).filter(s=>/[A-Za-z]/.test(s));
  const paras=raw.split(/\n+/).filter(p=>p.trim()).length;
  const t2=task.kind==='t2';const min=t2?250:150;const low=raw.toLowerCase();
  const notes=[];const add=(type,t)=>notes.push({type,t});
  if(wc<20)return{wc,empty:true};
  const lenRatio=Math.min(1,wc/min);
  // --- Task achievement
  let ta;const parasOK=t2?(paras>=4?1:paras===3?.7:.4):(paras>=3?1:.6);
  const pw=(task.prompt||'').toLowerCase().match(/[a-z]{5,}/g)||[];const pset=[...new Set(pw.filter(w=>!STOP.has(w)))];
  const cover=pset.length?pset.filter(w=>low.includes(w.slice(0,Math.max(4,w.length-2)))).length/pset.length:.6;
  const concl=/(in conclusion|to conclude|to sum up|in summary|overall|to summari[sz]e)/i.test(raw);
  if(t2){const stance=/\b(i (strongly |firmly |partly |largely |completely |totally )?(agree|disagree|believe|think|would argue|maintain)|in my (opinion|view)|my view|i am (convinced|of the opinion))\b/i.test(raw);
    ta=.4*lenRatio+.2*parasOK+.15*(concl?1:0)+.1*(stance?1:.3)+.15*Math.min(1,cover/.5);
    if(!stance)add('warn','Task Response: aniq pozitsiya (fikr) topilmadi. Kirishda "In my opinion/I firmly believe..." kabi tezis yozing (agar savol fikr so\'rasa).');
    if(!concl)add('warn','Xulosa belgisi topilmadi. Oxirgi paragraf "In conclusion, ..." bilan boshlansin.');
    if(paras<4)add('warn','Insho kamida 4 paragraf bo\'lishi tavsiya etiladi: kirish, 2 ta body, xulosa. Hozir: '+paras+'.');
  }else{const overview=/(overall|in summary|to summari[sz]e|generally speaking|it is clear that|as can be seen)/i.test(raw);const nums=(raw.match(/\d+/g)||[]).length;
    ta=.35*lenRatio+.25*(overview?1:.2)+.25*Math.min(1,nums/8)+.15*parasOK;
    if(!overview)add('bad','Overview (umumiy xulosa) topilmadi — Task 1 da bu eng muhim qism. "Overall, ..." bilan alohida paragraf yozing.');
    if(nums<5)add('warn','Raqamlar/ma\'lumotlar kam. Asosiy tendensiyalarni aniq sonlar bilan qo\'llab-quvvatlang.');
    if(/\b(i think|in my opinion|i believe|i feel)\b/i.test(raw)){ta-=.15;add('bad','Task 1 da shaxsiy fikr bildirilmaydi ("I think", "In my opinion" ni olib tashlang).')}}
  if(wc<min)add('bad',`So'z soni yetarli emas: ${wc} / ${min}. Kam so\'z Task Achievement/Response ballini tushiradi.`);
  else if(wc>min*1.6)add('warn',`Juda uzun (${wc} so'z). Ortiqcha uzunlik xatolar ehtimolini oshiradi; ${min}–${Math.round(min*1.3)} so'z yetarli.`);
  else add('good',`So'z soni yaxshi: ${wc}.`);
  // --- Coherence & Cohesion
  const used=LINKERS.filter(l=>new RegExp('\\b'+l.replace(/ /g,'\\s+')+'\\b','i').test(raw));
  const refs=lw.filter(w=>['this','these','such','they','it','those'].includes(w)).length/wc*100;
  const cc=.45*Math.min(1,used.length/(t2?8:5))+.3*parasOK+.25*Math.min(1,refs/2.5);
  if(used.length<(t2?5:3))add('warn','Bog\'lovchi vositalar kam ('+used.length+' xil). Ko\'proq turli linking words ishlating: however, moreover, as a result...');
  else add('good','Bog\'lovchi vositalar: '+used.slice(0,8).join(', ')+(used.length>8?'...':'')+'.');
  const counts={};lw.forEach(w=>counts[w]=(counts[w]||0)+1);
  const overLink=used.filter(l=>(low.match(new RegExp('\\b'+l.replace(/ /g,'\\s+')+'\\b','g'))||[]).length>=4);
  if(overLink.length)add('warn','"'+overLink[0]+'" juda ko\'p takrorlangan — sinonim bilan almashtiring.');

  const first=lw.slice(0,200);const ttr=new Set(first).size/first.length;
  const acadHits=lw.filter(w=>w.length>4&&ACAD_ROOTS.some(r=>w.startsWith(r.toLowerCase()))).length;const acad=acadHits/wc*100;
  const avgLen=words.join('').length/wc;

  const reps=Object.entries(counts).filter(([w,c])=>w.length>3&&!STOP.has(w)&&c>=Math.max(5,wc/40));

  if(reps.length)add('warn','Takrorlangan so\'zlar: '+reps.slice(0,4).map(r=>r[0]+' ('+r[1]+'×)').join(', ')+'. Sinonim ishlating (Khabib AI: "sinonim '+reps[0][0]+'").');
  if(acad<1.5)add('warn','Akademik leksika kam. Lug\'at bo\'limidagi so\'zlardan (significant, mitigate, outcome...) ishlating.');else add('good','Akademik so\'zlar yetarli ('+acadHits+' ta).');

  if(asl<12)add('warn','Gaplar juda qisqa (o\'rtacha '+asl.toFixed(1)+' so\'z). Ba\'zi gaplarni birlashtiring.');if(asl>30)add('warn','Gaplar juda uzun (o\'rtacha '+asl.toFixed(1)+' so\'z). Aniqlik uchun bo\'ling.');
  if(!errs.length&&!spelling.length)add('good','Odatiy grammatik xatolar topilmadi (bu faqat qoidalar asosidagi tekshiruv).');
  let b={TA:bandOf(ta),CC:bandOf(cc),LR:bandOf(lr),GRA:bandOf(gra)};

    let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(4000,text.length*120));speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){res()}})}

async function startRecorder(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)throw new Error('Brauzer mikrofon yozuvini qo\'llamaydi');
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(stream);const chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const done=new Promise(r=>{mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());r(new Blob(chunks,{type:mr.mimeType||'audio/webm'}))}});
  mr.start();const rec={stop(){if(mr.state!=='inactive')mr.stop();return done},cancel(){try{if(mr.state!=='inactive')mr.stop()}catch(e){}stream.getTracks().forEach(t=>t.stop())}};
  onLeave(()=>rec.cancel());return rec}

  try{const r=new SR();r.lang='en-GB';r.continuous=true;r.interimResults=true;let fin='';r._run=true;
    r.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript+' ';else it+=x[0].transcript}onUpdate&&onUpdate(fin,it)};
    r.onerror=()=>{};r.onend=()=>{if(r._run){try{r.start()}catch(e){}}};r.start();
    const o={stop(){r._run=false;try{r.stop()}catch(e){}},text:()=>fin.trim()};onLeave(()=>o.stop());return o}catch(e){return null}}

  return{n,fill,uniq,wpm,ttr:Math.round(uniq/n*100)}}

      el.textContent=fmtTime(prep);iv=setInterval(()=>{prep--;el.textContent=fmtTime(prep);if(prep<=0){clearInterval(iv);startSpeak()}},1000);
      $('#skip').onclick=()=>{clearInterval(iv);startSpeak()};busy=false;return}
    stage.innerHTML=`<div class="row"><span class="pill">Part ${it.part} · ${pn}</span>${it.topic?`<span class="pill">${esc(it.topic)}</span>`:''}</div><h2 style="margin:14px 0">${esc(it.q)}</h2><div class="row"><span class="rec" id="dot" hidden></span><span class="timer" id="ct" hidden>00:00</span><span class="pill" id="stt">Examiner gapiryapti…</span></div><div class="row" style="margin-top:12px"><button class="btn sec sm" id="rep">🔊 Takrorlash</button><button class="btn" id="nx" disabled>Keyingi savol →</button></div>`;

  function finish(){stopSay();const opts=[9,8.5,8,7.5,7,6.5,6,5.5,5,4.5,4].map(b=>`<option value="${b}" ${b===6?'selected':''}>${b.toFixed(1)}</option>`).join('');

function grammarPage(parts,mount){

  mount(`<h1>🧠 Grammar daraja testi</h1><p class="sub">40 ta savol, A1 dan C1 gacha. Natijada CEFR darajangiz, taxminiy IELTS oralig'i va zaif mavzularingiz ko'rsatiladi. Taxminan 15–20 daqiqa.</p>

  $('#st').onclick=show;
  function show(){const q=GRAMMAR[i];const pct=Math.round(i/GRAMMAR.length*100);
    $('#view').innerHTML=`<h1>🧠 Grammar test</h1><div class="bar" style="margin:8px 0 16px"><i style="width:${pct}%"></i></div><div class="card"><div class="row"><span class="pill">Savol ${i+1}/${GRAMMAR.length}</span></div><h2 style="font-size:22px;margin:14px 0">${esc(q.q).replace('___','<b style="color:var(--pri)">_____</b>')}</h2>
      ${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="g" value="${j}"> <b>${'ABCD'[j]}</b> &nbsp;${esc(o)}</label>`).join('')}<label class="opt"><input type="radio" name="g" value="-1"> <i>Bilmayman</i></label>
      <div class="row" style="margin-top:14px"><button class="btn" id="nx">${i<GRAMMAR.length-1?'Keyingi →':'Tugatish'}</button></div></div>`;
    $('#nx').onclick=()=>{const c=$('input[name=g]:checked');if(!c){toast('Javobni tanlang');return}ans[i]=+c.value;i++;if(i>=GRAMMAR.length)finish();else show()}}
  function finish(){
    const by={};GRAMMAR.forEach((q,k)=>{const b=by[q.l]=by[q.l]||{c:0,n:0};b.n++;if(ans[k]===q.a)b.c++});
    const order=['A1','A2','B1','B2','C1'];let lvl='A1';
    for(let k=0;k<order.length;k++){const b=by[order[k]];const r=b.c/b.n;if(r>=.6)lvl=order[k];else{const nb=by[order[k+1]];if(nb&&nb.c/nb.n>=.7)continue;break}}
    const L=LEVELS.find(x=>x.l===lvl);const score=GRAMMAR.filter((q,k)=>ans[k]===q.a).length;
    const wrong=GRAMMAR.map((q,k)=>({q,k})).filter(x=>ans[x.k]!==x.q.a);const weak={};wrong.forEach(x=>weak[x.q.tp]=(weak[x.q.tp]||0)+1);

    $('#view').innerHTML=`<h1>🧠 Natija</h1><div class="card" style="border-color:var(--pri)"><div class="row" style="gap:28px"><div class="stat"><span class="big">${lvl}</span><small>${L.name}</small></div><div class="stat"><span class="big">${score}/${GRAMMAR.length}</span><small>to'g'ri javob</small></div><div class="stat"><span class="big" style="font-size:30px">${L.ielts}</span><small>taxminiy IELTS</small></div></div>
     <p style="margin-top:14px">${esc(L.tip)}</p><div class="grid g3">${order.map(l=>`<div class="card" style="padding:10px"><b>${l}</b><div class="bar" style="margin:6px 0"><i style="width:${Math.round(by[l].c/by[l].n*100)}%"></i></div><small>${by[l].c}/${by[l].n}</small></div>`).join('')}</div>
     ${Object.keys(weak).length?`<h3>Zaif mavzular</h3><div>${Object.entries(weak).map(([k,v])=>`<span class="pill bad" style="margin:3px">${esc(k)} ×${v}</span>`).join('')}</div>`:'<div class="note good">Ajoyib — zaif mavzu topilmadi!</div>'}
     <div class="row" style="margin-top:14px"><button class="btn" id="rv">Xatolarni ko'rish</button><button class="btn sec" id="rt">Qayta topshirish</button><a class="btn sec" href="#/ai">Khabib AI dan maslahat</a></div></div><div id="rvbox"></div>`;
    $('#rt').onclick=()=>grammarPage(parts,mount);
