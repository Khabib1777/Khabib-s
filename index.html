/* ===== Khabib AI (offline, rule-based) ===== */
const AI={
  n:s=>String(s).toLowerCase().replace(/[’‘`ʻʼ']/g,'').replace(/\s+/g,' ').trim(),
  has(t,k){k=this.n(k);if(k.length<=4)return new RegExp('(^|[^a-z])'+k.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)').test(t);return t.includes(k)},
  answer(text){
    const raw=text.trim();const t=this.n(raw);
    if(/^\/check\b/i.test(raw)||raw.split(/\s+/).length>70){const body=raw.replace(/^\/check\s*/i,'');const a=analyzeWriting(body,{kind:'t2',prompt:''});a.kind='t2';return '<p>Matningizni tekshirdim (Task 2 mezonlari bo\'yicha):</p>'+renderAnalysis(a)}
    let m=raw.match(/^(?:tuzat|correct|grammar|xato)\s*[:\-]\s*([\s\S]+)/i);
    if(m){const s=m[1];const out=[];ERR_RULES.forEach(([re,msg])=>{const x=s.match(re);if(x)out.push(`<li>${esc(msg)} <code>"${esc(x[0].trim())}"</code></li>`)});(s.toLowerCase().match(/[a-z']+/g)||[]).forEach(w=>{if(MISSPELL[w])out.push(`<li>Imlo: <b>${esc(w)}</b> → <b>${esc(MISSPELL[w])}</b></li>`)});
      return out.length?`<p>Topilgan muammolar:</p><ul>${out.join('')}</ul><p style="font-size:13px">Bu faqat qoidalarga asoslangan tekshiruv — barcha xatolarni topa olmasligi mumkin.</p>`:'<p>Gapda mashhur xatolar topilmadi ✅ (lekin bu to\'liq grammatik tahlil emas).</p>'}
    m=t.match(/(?:sinonim|synonyms?|paraphrase|parafraz|muqobil)\s*(?:of|for|uchun)?\s*:?\s*([a-z ]{2,30})$/);
    if(m){const w=m[1].trim();const d=SYN[w]||SYN[w.replace(/s$/,'')];if(d)return `<p><b>${esc(w)}</b> uchun sinonimlar:</p><ul>${d.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p style="font-size:13px">Kontekstga mosini tanlang — barcha sinonimlar har joyda mos kelmaydi.</p>`;
      return `<p>"${esc(w)}" lug'atimda yo'q. Mavjud so'zlardan: ${Object.keys(SYN).slice(0,25).map(esc).join(', ')}…</p>`}
    m=t.match(/^(?:what does |meaning of |translate |tarjima )?([a-z\- ]{2,28}?)\s*(?:nima|manosi|tarjimasi|tarjima|meaning|means|degani)\b/)||t.match(/^(?:meaning of|translate|tarjima|what does)\s+([a-z\- ]{2,28})$/);
    if(m){const w=m[1].trim();const v=VOCAB.find(x=>x.w===w)||VOCAB.find(x=>x.w.startsWith(w)&&w.length>3)||VOCAB.find(x=>norm(x.uz).includes(w)&&w.length>3);
      if(v)return `<p><b>${esc(v.w)}</b> — ${esc(v.uz)}</p><p><i>${esc(v.ex)}</i></p>${SYN[v.w]?`<p>Sinonim: ${SYN[v.w].join(', ')}</p>`:''}`;
      return `<p>"${esc(w)}" so'zi lug'atimda yo'q (menda ${VOCAB.length} ta akademik so'z bor). "Lug'at" bo'limida qidirib ko'ring.</p>`}
    const nums=(t.match(/\d+(?:\.\d)?/g)||[]).map(Number);
    if(/(listening|reading|tinglash|oqish)/.test(t)&&nums.length&&nums[0]<=40&&/(band|ball|togri|ta)/.test(t)){const r=nums[0];const b=rawToBand(r,40);return `<p><b>${r}/40</b> ≈ <b>Band ${bandStr(b)}</b> (Academic jadvali bo'yicha, taxminiy).</p>`}
    if(/(overall|umumiy|o.rtacha)/.test(t)&&nums.filter(x=>x<=9).length>=3){const a=nums.filter(x=>x<=9).slice(0,4);const avg=a.reduce((x,y)=>x+y,0)/a.length;return `<p>Ballar: ${a.join(', ')} → o'rtacha ${avg.toFixed(2)} → <b>Overall ${bandStr(roundHalf(avg))}</b>.</p>`}
    if(/(reja|plan|jadval)/.test(t)&&nums.length){let tg=nums.find(x=>x>=4&&x<=9)||6.5;let wk=nums.find(x=>x>=2&&x<=52&&x!==tg)||8;const p1=Math.max(1,Math.round(wk*.25)),p3=Math.max(1,Math.round(wk*.25)),p2=Math.max(1,wk-p1-p3);
      return `<p><b>${wk} haftalik reja (maqsad: band ${tg}):</b></p><ul><li><b>1–${p1}-hafta (asos):</b> Grammar daraja testi, kuniga 10 so'z, 1 Listening section, 1 Reading passage, hafta oxirida 1 Writing Task 2.</li><li><b>${p1+1}–${p1+p2}-hafta (ko'nikma):</b> Har kuni 2 ko'nikma: Listening+Reading dushanba–juma, Writing (Task 1 va 2 navbat bilan) haftada 3 marta, Speaking Part 2 yozib olib tinglash haftada 3 marta. Xatolar daftari.</li><li><b>${p1+p2+1}–${wk}-hafta (mock):</b> Haftada 2 ta to'liq mock (Mock bo'limi), xatolar tahlili, zaif turlarga qaytish, vaqt nazorati.</li></ul><p>Kuniga ${tg>=7?'3–4':'2–3'} soat ajrating. Maqsad ${tg}: ${tg>=7?'Writing va Speaking uchun fikr-mulohaza muhim — natijalarni "Natijalar" bo\'limida kuzating.':'avval Listening/Reading ni 6.5 ga yetkazing, so\'ng Writing ga ko\'proq vaqt bering.'}</p>`}
    let best=null,bs=0;KB.forEach(e=>{let s=0;e.k.forEach(k=>{if(this.has(t,k))s+=(k.length>5?2:1)});if(s>bs){bs=s;best=e}});
    if(best&&bs>=1)return best.a;
    return `<p>Savolingizni to'liq tushunmadim 🤔 Men oflayn, qoidalarga asoslangan yordamchiman. Quyidagilarni so'rab ko'ring:</p><ul><li>"Listening bo'yicha maslahat"</li><li>"Task 2 tuzilishi"</li><li>"sinonim important"</li><li>"accumulate nima"</li><li>"reja 7 10 hafta"</li><li>"listening 32 ta to'g'ri"</li><li>Insho matnini tashlang yoki <code>/check</code> yozing</li></ul>`}
};

  const hist=Store.get('chat',[{r:'a',h:AI.answer('salom')}]);

/* ===== Progress ===== */
function progressPage(parts,mount){
  const h=getHistory();const mods=[['listening','🎧 Listening'],['reading','📖 Reading'],['writing','✍️ Writing'],['speaking','🗣️ Speaking']];
  const lastOf=m=>{const x=h.filter(r=>r.module===m&&r.band!=null);return x.length?x[x.length-1].band:null};
  const bestOf=m=>{const x=h.filter(r=>r.module===m&&r.band!=null).map(r=>r.band);return x.length?Math.max(...x):null};
  const cnt=m=>h.filter(r=>r.module===m).length;
  const lasts=mods.map(m=>lastOf(m[0])).filter(x=>x!=null);const est=lasts.length===4?roundHalf(lasts.reduce((a,b)=>a+b,0)/4):null;
  const target=Store.get('target',7);const gl=h.filter(r=>r.module==='grammar').slice(-1)[0];
  const series=mods.map((m,i)=>({n:m[1].slice(3),v:h.filter(r=>r.band!=null&&['listening','reading','writing','speaking'].includes(r.module)).map(r=>r.module===m[0]?r.band:null),color:PALETTE[i]}));
  const pts=h.filter(r=>r.band!=null&&['listening','reading','writing','speaking'].includes(r.module));
  mount(`<h1>📊 Natijalar</h1><p class="sub">Barcha ballaringiz shu qurilmada (brauzer xotirasida) saqlanadi. Zaxira nusxa olish uchun "Eksport"dan foydalaning.</p>
  <div class="grid g4">${mods.map(m=>`<div class="card stat"><span class="big">${bandStr(lastOf(m[0]))}</span><small>${m[1]} · oxirgi<br>eng yaxshi: ${bandStr(bestOf(m[0]))} · urinish: ${cnt(m[0])}</small></div>`).join('')}</div>
  <div class="grid g3" style="margin-top:14px"><div class="card stat"><span class="big">${bandStr(est)}</span><small>Taxminiy Overall ${est==null?'(4 ta bo\'limda natija kerak)':''}</small></div>
   <div class="card"><b>Maqsadli band</b><div class="slide" style="margin-top:8px"><input type="range" id="tg" min="4" max="9" step=".5" value="${target}"><b id="tgv">${bandStr(target)}</b></div><div class="bar" style="margin-top:10px"><i style="width:${est?Math.min(100,Math.round(est/target*100)):0}%"></i></div><small>${est?(est>=target?'🎯 Maqsadga yetdingiz!':'Maqsadga '+bandStr(target-est)+' band qoldi'):'Hali baholash uchun ma\'lumot yetarli emas'}</small></div>
   <div class="card stat"><span class="big">${streak()}</span><small>🔥 ketma-ket kunlar<br>Grammar: ${gl?gl.level:'—'}</small></div></div>
  <h2>O'sish grafigi</h2>${pts.length>=2?svgLine({cats:pts.map((r,i)=>String(i+1)),series},{min:0,max:9}):'<div class="card">Grafik uchun kamida 2 ta natija kerak.</div>'}
  <h2>Tarix</h2><div class="card" style="overflow:auto"><table class="t hist"><tr><th>Sana</th><th>Bo'lim</th><th>Test</th><th>Natija</th><th>Band/Daraja</th><th></th></tr>${h.slice().reverse().map(r=>`<tr><td>${fmtDate(r.ts)}</td><td>${esc(r.module)}</td><td>${esc(r.title||'')}</td><td>${r.raw!=null?r.raw+'/'+r.total:r.score!=null?r.score+'/'+r.total:r.wc?r.wc+' so\'z':'—'}</td><td><b>${r.level||bandStr(r.band)}</b>${r.self?' <small>(o\'zim baholadim)</small>':''}</td><td><button class="btn sec sm" data-x="${r.id}">✕</button></td></tr>`).join('')||'<tr><td colspan="6">Hali natija yo\'q.</td></tr>'}</table></div>
  <div class="row" style="margin-top:14px"><button class="btn sec" id="ex">⬇ Eksport (JSON)</button><label class="btn sec" style="cursor:pointer">⬆ Import<input type="file" id="im" accept=".json" hidden></label><button class="btn bad" id="rs">Hammasini o'chirish</button></div>`);
  $('#tg').oninput=e=>{Store.set('target',+e.target.value);$('#tgv').textContent=bandStr(+e.target.value)};$('#tg').onchange=()=>progressPage(parts,mount);
  $$('[data-x]').forEach(b=>b.onclick=()=>{Store.set('history',getHistory().filter(r=>r.id!==b.dataset.x));progressPage(parts,mount)});
  $('#ex').onclick=()=>{const data={history:getHistory(),essays:Store.get('essays',[]),vk:Store.get('vk',{}),target:Store.get('target',7),days:Store.get('days',[])};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download='khabibs-progress.json';a.click()};
  $('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.history)Store.set('history',d.history);if(d.essays)Store.set('essays',d.essays);if(d.vk)Store.set('vk',d.vk);if(d.target)Store.set('target',d.target);if(d.days)Store.set('days',d.days);toast('Import qilindi');progressPage(parts,mount)}catch(err){toast('Fayl noto\'g\'ri')}};rd.readAsText(f)};
  $('#rs').onclick=()=>{if(confirm('Barcha natijalar o\'chiriladi. Davom etasizmi?')){['history','essays','vk','days','mock'].forEach(k=>Store.set(k,k==='vk'?{}:[]));Store.set('mock',{});progressPage(parts,mount)}};
}

/* ===== Mock ===== */
function mockPage(parts,mount){
  const m=Store.get('mock',{});const items=[['listening','🎧 Listening','#/listening/run/LA/all','To\'liq Listening A (40 savol)'],['reading','📖 Reading','#/reading/run/RA','To\'liq Reading A (30 savol, 40 ga moslangan)'],['writing','✍️ Writing','#/writing/t2','Task 2 esse yozing va "Natijani saqlash" ni bosing'],['speaking','🗣️ Speaking','#/speaking/partner','Speaking partner bilan interview va o\'z-o\'zini baholash']];
  const vals=items.map(i=>m[i[0]]).filter(x=>x!=null);const done=vals.length===4;const overall=done?roundHalf(vals.reduce((a,b)=>a+b,0)/4):null;
  mount(`<h1>🏁 Full Mock</h1><p class="sub">To'rt bo'limni ketma-ket bajaring. Har bo'lim natijasi shu yerga yig'iladi va umumiy band hisoblanadi.</p>
  <div class="grid g2">${items.map(i=>`<div class="card"><div class="row"><b style="font-size:18px">${i[1]}</b><span class="sp"></span>${m[i[0]]!=null?`<span class="pill ok">Band ${bandStr(m[i[0]])}</span>`:'<span class="pill">Kutilmoqda</span>'}</div><p class="sub">${i[3]}</p><button class="btn sm" data-go="${i[0]}" data-h="${i[2]}">${m[i[0]]!=null?'Qayta bajarish':'Boshlash'}</button></div>`).join('')}</div>
  <div class="card" style="margin-top:14px;text-align:center"><span class="big">${bandStr(overall)}</span><br><small>Mock Overall Band ${done?'':'(4 bo\'lim tugagach hisoblanadi)'}</small><div class="row" style="justify-content:center;margin-top:10px">${done?'<button class="btn ok" id="svm">Natijani saqlash</button>':''}<button class="btn sec" id="nm">Yangi mock</button></div></div>`);
  $$('[data-go]').forEach(b=>b.onclick=()=>{K.mockTarget=b.dataset.go;location.hash=b.dataset.h});
  $('#nm').onclick=()=>{Store.set('mock',{});mockPage(parts,mount)};
  const sv=$('#svm');if(sv)sv.onclick=()=>{addResult({module:'mock',title:'Full Mock',band:overall,detail:m});toast('Saqlandi');sv.disabled=true};
}

['A1','Ko\'plik','<p>Unli bilan tugasa: <b>+s</b> (casa → casas). Undosh bilan tugasa: <b>+es</b> (ciudad → ciudades). <b>-z → -ces</b> (lápiz → lápices). Urg\'u belgisi o\'zgarishi mumkin: canción → canciones.</p>'],
['A1','Olmoshlar va SER','<p>yo, tú, él/ella/usted, nosotros, vosotros, ellos/ellas/ustedes. Ispan tilida ega odatda tushiriladi: <i>Hablo español</i>. <b>Usted</b> — rasmiy "Siz".</p><p><b>SER</b>: soy, eres, es, somos, sois, son. Ishlatiladi: shaxs, kasb, millat, doimiy sifat, vaqt, material. <i>Soy estudiante. Es de Uzbekistán. Son las tres.</i></p>'],

['A2','Muhim noto\'g\'ri fe\'llar','<table class="t"><tr><th>fe\'l</th><th>yo</th><th>tú</th><th>nosotros</th></tr><tr><td>tener (ega bo\'lmoq)</td><td>tengo</td><td>tienes</td><td>tenemos</td></tr><tr><td>ir (bormoq)</td><td>voy</td><td>vas</td><td>vamos</td></tr><tr><td>hacer (qilmoq)</td><td>hago</td><td>haces</td><td>hacemos</td></tr><tr><td>querer (xohlamoq)</td><td>quiero</td><td>quieres</td><td>queremos</td></tr><tr><td>poder (qila olmoq)</td><td>puedo</td><td>puedes</td><td>podemos</td></tr><tr><td>decir (aytmoq)</td><td>digo</td><td>dices</td><td>decimos</td></tr></table><p><b>Burun (e→ie, o→ue)</b>: o\'zak urg\'uli bo\'lganda o\'zgaradi, nosotros/vosotros da o\'zgarmaydi. <b>-go</b> fe\'llar: tener, hacer, poner (pongo), salir (salgo), venir (vengo). Yosh: <i>Tengo 25 años</i> (tener bilan!). Majburiyat: <b>tener que + fe\'l</b>.</p>'],
['A2','Gustar va egalik','<p><b>Me gusta</b> + birlik/fe\'l, <b>me gustan</b> + ko\'plik. Me, te, le, nos, os, les. <i>Me gusta el té. Me gustan los gatos. Nos gusta leer.</i> Xuddi shunday: encantar, interesar, doler.</p><p>Egalik: mi(s), tu(s), su(s), nuestro/a(s), vuestro/a(s). Ko\'rsatish: este/esta (bu), ese/esa (u), aquel/aquella (anavi). Taqqoslash: <b>más/menos + sifat + que</b>, <b>tan … como</b>, <b>el más…</b>; mejor, peor.</p>'],
['A2','Refleksiv fe\'llar va ob\'ekt olmoshlari','<p>Refleksiv: me, te, se, nos, os, se — <i>levantarse: me levanto, te levantas…</i> Kundalik: despertarse, ducharse, vestirse, acostarse, llamarse (<i>Me llamo Ali</i>).</p><p>To\'g\'ri to\'ldiruvchi: <b>lo, la, los, las</b>; egri: <b>me, te, le, nos, os, les</b>. Fe\'l oldidan: <i>Lo veo.</i> Infinitivga yopishadi: <i>Quiero verlo.</i> Ikkalasi birga: le+lo → <b>se lo</b>: <i>Se lo doy.</i></p>'],
['A2','Pretérito indefinido (tugagan o\'tgan)','<table class="t"><tr><th></th><th>-ar (hablar)</th><th>-er/-ir (comer)</th></tr><tr><td>yo</td><td>hablé</td><td>comí</td></tr><tr><td>tú</td><td>hablaste</td><td>comiste</td></tr><tr><td>él</td><td>habló</td><td>comió</td></tr><tr><td>nosotros</td><td>hablamos</td><td>comimos</td></tr><tr><td>ellos</td><td>hablaron</td><td>comieron</td></tr></table><p>Noto\'g\'ri: ser/ir → fui, fuiste, fue, fuimos, fueron; hacer → hice, hizo; tener → tuve; estar → estuve; decir → dije; poder → pude; venir → vine. Belgilar: ayer, anoche, el año pasado.</p>'],
['B1','Imperfecto va Perfecto','<p><b>Imperfecto</b> (odat, fon, tavsif): -ar → <b>-aba, -abas, -aba, -ábamos, -aban</b>; -er/-ir → <b>-ía, -ías, -ía, -íamos, -ían</b>. Faqat 3 ta noto\'g\'ri: ser (era), ir (iba), ver (veía). <i>De niño jugaba mucho. Llovía cuando salí.</i></p><p><b>Indefinido</b> = bir marta tugagan voqea; <b>Imperfecto</b> = davom etgan/odat/fon. Belgilar: siempre, a menudo, mientras.</p><p><b>Pretérito perfecto</b>: <b>haber (he, has, ha, hemos, habéis, han) + -ado/-ido</b>. <i>He comido. ¿Has estado en Madrid?</i> Noto\'g\'ri: hecho, dicho, visto, escrito, puesto, vuelto, roto.</p>'],
['B1','Kelasi zamon, shart, buyruq','<p><b>Ir a + infinitivo</b> (yaqin kelajak): <i>Voy a estudiar.</i> <b>Futuro</b>: infinitivga <b>-é, -ás, -á, -emos, -éis, -án</b>: hablaré. Noto\'g\'ri o\'zak: tendré, haré, podré, diré, saldré, vendré, pondré.</p><p><b>Condicional</b>: infinitiv + <b>-ía, -ías, -ía, -íamos, -íais, -ían</b>: <i>Me gustaría viajar. ¿Podrías ayudarme?</i> (muloyim so\'rov).</p><p><b>Imperativo</b>: tú — 3-shaxs shakli (<i>habla, come</i>); inkor: <i>no hables, no comas</i>. Usted: <i>hable, coma</i>.</p>'],
